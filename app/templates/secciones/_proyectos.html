<section class="seccion" id="proyectos">
  <div class="contenedor">
    <div class="titulo-seccion reveal">
      <h2><i class="fa-solid fa-diagram-project" aria-hidden="true"></i> Proyectos</h2>
      {% if session.get('usuario_id') %}
        <button class="agregar" type="button" data-modal="modal-proyecto">
          <i class="fa-solid fa-plus" aria-hidden="true"></i> Agregar
        </button>
      {% endif %}
    </div>

    <div class="proyectos-grid">
      {% for item in proyectos %}
        <article class="tarjeta-proyecto reveal">
          <img src="{{ url_for('static', filename=item.imagen_url) }}"
               alt="Captura de {{ item.nombre }}"
               loading="lazy"
               onerror="this.onerror=null;this.src='{{ url_for('static', filename='img/placeholder-proyecto.svg') }}'">
          <div class="tarjeta-cuerpo">
            <h3>{{ item.resumen() }}</h3>
            <p>{{ item.descripcion }}</p>
            <a class="enlace-proyecto" href="{{ item.link }}" target="_blank" rel="noopener noreferrer">
              Ver proyecto <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
            </a>
            {% if session.get('usuario_id') %}
              <div class="iconos-edicion">
                <button type="button"
                        data-modal="modal-proyecto"
                        data-id="{{ item.id }}"
                        data-url-editar="{{ url_for('edicion.datos_para_editar', entidad='proyecto', item_id=item.id) }}"
                        aria-label="Editar proyecto">
                  <i class="fa-solid fa-pen" aria-hidden="true"></i>
                </button>
                <form class="formulario-eliminar" method="post"
                      action="{{ url_for('edicion.eliminar', entidad='proyecto', item_id=item.id) }}">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                  <button type="submit" data-confirmar="¿Eliminar este proyecto?" aria-label="Eliminar proyecto">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                  </button>
                </form>
              </div>
            {% endif %}
          </div>
        </article>
      {% else %}
        <p class="vacio reveal">Todavía no cargué proyectos.</p>
      {% endfor %}
    </div>
  </div>
</section>
